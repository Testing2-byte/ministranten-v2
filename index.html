<style>
/* ════════════════════════════════════════════
   DESIGN SYSTEM — Ministrantenverwaltung
   ════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,600;1,400&display=swap');

:root {
  --bg:#F6F6F7; --sur:#FFFFFF; --sur2:#F0F0F2; --sur3:#E6E6EA;
  --bd:rgba(0,0,0,.08); --bd2:rgba(0,0,0,.14);
  --tx:#111113; --tx2:#52525B; --tx3:#A1A1AA;
  --ac:#2563EB; --ach:#1D4ED8; --ac2:#EFF4FF; --ac3:#93C5FD;
  --gr:#16A34A; --gr2:#F0FDF4;
  --rd:#DC2626; --rd2:#FEF2F2;
  --am:#D97706; --am2:#FFFBEB;
  --pu:#7C3AED; --pu2:#F5F3FF;
  --sw:250px; --r:8px; --rl:12px; --rxl:16px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.06);
  --sh-md:0 4px 16px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.05);
  --sh-lg:0 20px 60px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);
  --fn:'Inter',system-ui,sans-serif;
  --fns:'Lora',Georgia,serif;
}
.dark {
  --bg:#0E0E11; --sur:#17171C; --sur2:#1F1F26; --sur3:#27272F;
  --bd:rgba(255,255,255,.07); --bd2:rgba(255,255,255,.12);
  --tx:#EDEDF0; --tx2:#9898A4; --tx3:#5A5A66;
  --ac:#3B82F6; --ach:#2563EB; --ac2:#1A2540; --ac3:#60A5FA;
  --gr:#22C55E; --gr2:#0D2018;
  --rd:#EF4444; --rd2:#220D0D;
  --am:#F59E0B; --am2:#1E1400;
  --pu:#A78BFA; --pu2:#1C1530;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--fn)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

/* ── SPLASH SCREEN ──────────────────────── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(145deg,#1E3A8A 0%,#1D4ED8 40%,#2563EB 70%,#3B82F6 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  transition:opacity .5s ease,transform .5s ease;
}
#splash.fade-out{opacity:0;transform:scale(1.02);pointer-events:none}
.sp-cross{
  width:72px;height:72px;
  background:rgba(255,255,255,.15);
  border:1.5px solid rgba(255,255,255,.3);
  border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;
  backdrop-filter:blur(8px);
  margin-bottom:22px;
  animation:sp-pop .6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes sp-pop{from{opacity:0;transform:scale(.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.sp-title{
  font-family:var(--fns);font-size:28px;color:#fff;font-weight:600;
  animation:sp-up .5s .15s ease both;
}
.sp-sub{
  font-size:13px;color:rgba(255,255,255,.55);margin-top:6px;
  animation:sp-up .5s .25s ease both;
}
.sp-bar{
  width:180px;height:3px;background:rgba(255,255,255,.15);
  border-radius:3px;margin-top:36px;overflow:hidden;
  animation:sp-up .5s .35s ease both;
}
.sp-prog{
  height:100%;background:rgba(255,255,255,.8);border-radius:3px;
  width:0%;transition:width .8s cubic-bezier(.4,0,.2,1);
}
@keyframes sp-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── LOGIN ──────────────────────────────── */
.ls{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:9000;padding:20px;
  background-image:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(37,99,235,.08) 0%,transparent 100%);
}
.lc{
  background:var(--sur);border-radius:20px;box-shadow:var(--sh-lg);
  width:100%;max-width:400px;border:1px solid var(--bd);overflow:hidden;
}
.lh{
  padding:32px 32px 26px;text-align:center;
  background:linear-gradient(160deg,#1E3A8A,#2563EB 70%,#3B82F6);
  position:relative;overflow:hidden;
}
.lh::after{
  content:'✝';position:absolute;right:-20px;bottom:-30px;
  font-size:120px;opacity:.05;line-height:1;
}
.lh-ic{
  width:58px;height:58px;background:rgba(255,255,255,.15);border-radius:17px;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  margin:0 auto 16px;border:1.5px solid rgba(255,255,255,.25);
  backdrop-filter:blur(4px);position:relative;
}
.lh-t{font-family:var(--fns);font-size:22px;color:#fff;position:relative}
.lh-s{font-size:12px;color:rgba(255,255,255,.55);margin-top:5px;position:relative}
.lb{padding:28px 28px 32px}
.l-lbl{font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:block}
.l-err{color:var(--rd);font-size:13px;display:none;padding:10px 14px;background:var(--rd2);border-radius:var(--r);border:1px solid rgba(220,38,38,.15);margin-top:8px}

/* ── APP SHELL ──────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:var(--sw);background:#111113;flex-shrink:0;
  display:flex;flex-direction:column;overflow-y:auto;
  z-index:100;border-right:1px solid rgba(255,255,255,.05);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.dark .sidebar{background:#0C0C0F}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── SIDEBAR PARTS ──────────────────────── */
.sb-logo{
  padding:18px 16px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.sb-logo-ic{
  width:34px;height:34px;background:var(--ac);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  box-shadow:0 2px 10px rgba(37,99,235,.4);
}
.sb-logo-nm{font-family:var(--fns);font-size:14px;color:#fff;line-height:1.2}
.sb-logo-sm{font-size:10px;color:rgba(255,255,255,.28);margin-top:1px}
.sb-sec{font-size:10px;color:rgba(255,255,255,.2);padding:14px 16px 4px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.sb-it {
  display:flex;align-items:center;gap:9px;padding:7px 16px;
  cursor:pointer;color:rgba(255,255,255,.42);transition:all .12s;
  font-size:13px;position:relative;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.sb-it::before{
  content:'';position:absolute;left:0;top:4px;bottom:4px;
  width:2px;border-radius:0 2px 2px 0;background:var(--ac3);opacity:0;transition:opacity .12s;
}
.sb-it:hover{color:rgba(255,255,255,.78);background:rgba(255,255,255,.04)}
.sb-it.on{color:#fff;background:rgba(255,255,255,.07)}
.sb-it.on::before{opacity:1}
.sb-it .ic{width:16px;text-align:center;font-size:14px;flex-shrink:0}
.sb-it .bdg{
  margin-left:auto;background:var(--rd);color:#fff;
  font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;
}
.sb-btm{margin-top:auto}
.sb-util{padding:8px 10px;border-top:1px solid rgba(255,255,255,.05);display:flex;gap:4px}
.sb-util-btn{
  flex:1;padding:7px;background:rgba(255,255,255,.05);border:none;
  color:rgba(255,255,255,.38);border-radius:7px;cursor:pointer;
  font-size:14px;transition:all .12s;
}
.sb-util-btn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
.sb-user{
  padding:14px 16px;border-top:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .12s;
}
.sb-user:hover{background:rgba(255,255,255,.03)}
.sb-un{font-size:13px;font-weight:500;color:rgba(255,255,255,.82)}
.sb-ur{font-size:11px;color:rgba(255,255,255,.3)}

/* ── TOPBAR ─────────────────────────────── */
.topbar{
  background:var(--sur);border-bottom:1px solid var(--bd);
  padding:0 24px;height:56px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;gap:12px;
  padding-top: env(safe-area-inset-top);
  box-sizing: content-box;
}
.pt{font-weight:600;font-size:16px;color:var(--tx)}
.pc{font-size:11px;color:var(--tx3)}
.tb-r{display:flex;align-items:center;gap:6px}
.ic-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--bd2);
  background:transparent;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:15px;transition:all .12s;position:relative;color:var(--tx2);
}
.ic-btn:hover{background:var(--sur2)}
.ndot{
  position:absolute;top:6px;right:6px;width:6px;height:6px;
  background:var(--rd);border-radius:50%;border:1.5px solid var(--sur);display:none;
}
.tb-av{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;cursor:pointer;
  border:2px solid transparent;transition:all .12s;
}
.tb-av:hover{border-color:var(--ac)}
.tb-sep{width:1px;height:18px;background:var(--bd);margin:0 2px}
.menu-btn{display:none}

/* ── CONTENT ─────────────────────────────── */
.cnt{flex:1;overflow-y:auto;padding:24px;background:var(--bg);-webkit-overflow-scrolling: touch;}

/* ── AVATAR ─────────────────────────────── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.av-sm{width:28px;height:28px;font-size:11px}
.av-md{width:36px;height:36px;font-size:13px}
.av-lg{width:44px;height:44px;font-size:15px}
.av-xl{width:60px;height:60px;font-size:20px}
.c-m{background:var(--ac2);color:var(--ac)}
.c-o{background:var(--gr2);color:var(--gr)}
.c-a{background:var(--am2);color:var(--am)}

/* ── CARDS ───────────────────────────────── */
.card{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.ch{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.ch-act{margin-left:auto}
.stat-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);padding:16px;box-shadow:var(--sh);transition:box-shadow .12s}
.stat:hover{box-shadow:var(--sh-md)}
.st-l{font-size:10px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.st-v{font-size:28px;font-weight:700;color:var(--tx);line-height:1.1}
.st-s{font-size:11px;color:var(--tx3);margin-top:2px}

/* ── GRIDS ───────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g62{display:grid;grid-template-columns:3fr 2fr;gap:14px}

/* ── BUTTONS ─────────────────────────────── */
.btn{
  padding:8px 16px;font-size:13px;border-radius:var(--r);
  border:1px solid var(--bd2);background:var(--sur);color:var(--tx);
  cursor:pointer;font-weight:500;transition:all .12s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:var(--sur2)}
.btn:active{transform:scale(.98)}
.btn, .ic-btn, .sb-it, .dc { -webkit-tap-highlight-color: transparent; }

.btn-p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn-p:hover{background:var(--ach);border-color:var(--ach)}
.btn-g{background:var(--gr2);border-color:var(--gr);color:var(--gr)}
.btn-d{background:var(--rd2);border-color:var(--rd);color:var(--rd)}
.btn-gh{border:none;background:transparent;color:var(--tx2)}
.btn-gh:hover{background:var(--sur2)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}

/* ── FORM ────────────────────────────────── */
.fg{margin-bottom:14px}
.fl{font-size:12px;color:var(--tx2);font-weight:600;display:block;margin-bottom:5px}
.input{
  width:100%;padding:9px 12px;font-size:13px;
  border:1px solid var(--bd2);border-radius:var(--r);
  background:var(--sur);color:var(--tx);outline:none;
  transition:border .12s,box-shadow .12s;
}
.input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.input::placeholder{color:var(--tx3)}
.input-r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pw-wrap{position:relative}
.pw-tgl{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--tx3);cursor:pointer;
  padding:5px;display:flex;align-items:center;justify-content:center;
  transition:color .2s;
}
.pw-tgl:hover{color:var(--ac)}
.pw-tgl svg{width:18px;height:18px;stroke-width:2;fill:none;stroke:currentColor}
.pw-wrap .input{padding-right:40px}
textarea.input{resize:vertical;min-height:76px}
select.input{cursor:pointer}

/* ── TAGS ────────────────────────────────── */
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap;display:inline-block}
.tg{background:var(--gr2);color:var(--gr)}
.tr{background:var(--rd2);color:var(--rd)}
.tb{background:var(--ac2);color:var(--ac)}
.ta{background:var(--am2);color:var(--am)}
.tp{background:var(--pu2);color:var(--pu)}
.tgr{background:var(--sur2);color:var(--tx2)}

/* ── LIST ────────────────────────────────── */
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:none}
.li-t{font-size:13px;font-weight:500;color:var(--tx)}
.li-s{font-size:11px;color:var(--tx3);margin-top:2px}

/* ── NOTICE ──────────────────────────────── */
.notice{padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;border:1px solid transparent}
.ni{background:var(--ac2);color:var(--ac);border-color:rgba(37,99,235,.15)}
.nw{background:var(--am2);color:var(--am);border-color:rgba(217,119,6,.15)}
.ns{background:var(--gr2);color:var(--gr);border-color:rgba(22,163,74,.15)}
.ne{background:var(--rd2);color:var(--rd);border-color:rgba(220,38,38,.15)}

/* ── CALENDAR ────────────────────────────── */
.cal{background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd)}
.cal-m{font-family:var(--fns);font-size:16px;color:var(--tx)}
.cal-nb{width:28px;height:28px;border:1px solid var(--bd2);border-radius:8px;background:var(--sur);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx2);transition:all .1s}
.cal-nb:hover{background:var(--sur2)}
.cal-vt{display:flex;gap:4px}
.cal-vb{padding:4px 10px;border:1px solid var(--bd);border-radius:6px;font-size:11px;cursor:pointer;background:transparent;color:var(--tx3);font-family:var(--fn);transition:all .1s}
.cal-vb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cal-g{padding:10px}
.dn-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dn{text-align:center;font-size:10px;font-weight:600;color:var(--tx3);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dc{min-height:52px;border-radius:8px;padding:4px;cursor:pointer;border:1.5px solid transparent;transition:all .1s;position:relative}
.dc:hover{background:var(--sur2)}
.dc.tod{border-color:var(--ac)}
.dc.om{opacity:.28}
.dc.hev{background:var(--ac2)}
.dc.blk{background:var(--rd2)}
.dc.fer{opacity:.6}
.dnum{font-size:12px;font-weight:500;color:var(--tx);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dc.tod .dnum{background:var(--ac);color:#fff}
.dc.hev .dnum{color:var(--ac)}
.dc.blk .dnum{color:var(--rd)}
.dev{font-size:9px;padding:1px 4px;border-radius:3px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.dev-m{background:rgba(22,163,74,.1);color:var(--gr)}
.dev-s{background:rgba(37,99,235,.08);color:var(--ac)}
.dev-b{background:rgba(220,38,38,.1);color:var(--rd)}
.dev-f{background:var(--am2);color:var(--am)}

/* ── AI PANEL ────────────────────────────── */
.ai-p{background:linear-gradient(135deg,var(--ac2),var(--pu2));border:1px solid rgba(124,58,237,.15);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.dark .ai-p{background:linear-gradient(135deg,#1A2540,#1C1530);border-color:rgba(124,58,237,.25)}
.ai-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ai-ic{width:32px;height:32px;background:linear-gradient(135deg,var(--ac),var(--pu));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:#fff}
.ai-title{font-size:13px;font-weight:600;color:var(--ac)}
.ai-sub{font-size:11px;color:var(--pu)}
.dark .ai-sub{color:var(--ac3)}
.dot-s{display:flex;gap:4px;align-items:center}
.dot-s span{width:5px;height:5px;background:var(--ac);border-radius:50%;animation:bp 1.2s infinite}
.dot-s span:nth-child(2){animation-delay:.2s}
.dot-s span:nth-child(3){animation-delay:.4s}
@keyframes bp{0%,80%,100%{opacity:.3;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.ai-sg{background:var(--sur);border:1px solid rgba(165,180,252,.3);border-radius:var(--r);padding:10px 12px;margin-top:7px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:10px}
.ai-sg:hover{border-color:var(--ac);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.sg-sc{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}

/* ── MINI SELECT ─────────────────────────── */
.msi-g{display:flex;flex-direction:column;gap:5px;max-height:280px;overflow-y:auto;padding-right:2px}
.msi{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:all .12s;background:var(--sur)}
.msi:hover{border-color:var(--bd2)}
.msi.sel{border-color:var(--ac);background:var(--ac2)}
.msi.una{opacity:.45;cursor:not-allowed}
.msi.una:hover{border-color:var(--bd);background:var(--sur)}
.msi-ck{width:17px;height:17px;border:1.5px solid var(--bd2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .1s}
.msi.sel .msi-ck{background:var(--ac);border-color:var(--ac);color:#fff}

/* ── MODAL ───────────────────────────────── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:8000;padding:16px;backdrop-filter:blur(2px)}
.mbox{background:var(--sur);border-radius:var(--rxl);box-shadow:var(--sh-lg);width:100%;max-width:480px;padding:24px;max-height:90vh;overflow-y:auto;border:1px solid var(--bd)}
.mbox-lg{max-width:620px}
.mbox-sm{max-width:380px}
.mt{font-size:17px;font-weight:600;color:var(--tx);margin-bottom:18px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--bd)}

/* ── TOAST ───────────────────────────────── */
.ta-c{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:9999;pointer-events:none}
.ta{background:#18181C;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);animation:ta-in .2s ease;display:flex;align-items:center;gap:8px}
.ta.s{background:#14532D;border-color:rgba(34,197,94,.2)}
.ta.e{background:#7F1D1D;border-color:rgba(239,68,68,.2)}
@keyframes ta-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── NOTIFICATIONS ───────────────────────── */
.nd{position:fixed;top:58px;right:16px;width:320px;background:var(--sur);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh-lg);z-index:7000;overflow:hidden}
.ni-it{display:flex;gap:10px;padding:11px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--bd)}
.ni-it:hover{background:var(--sur2)}
.ni-it.ur{background:var(--ac2)}
.dark .ni-it.ur{background:rgba(59,130,246,.08)}
.ni-it:last-child{border-bottom:none}
.ni-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--sur2)}
.ni-tx{font-size:12px;color:var(--tx);line-height:1.4}
.ni-tm{font-size:11px;color:var(--tx3);margin-top:2px}

/* ── SWAP CARD ───────────────────────────── */
.sw-c{border:1px solid var(--bd);border-radius:var(--rl);padding:14px;margin-bottom:10px;background:var(--sur);box-shadow:var(--sh)}
.sw-c.pend{border-color:var(--am);background:var(--am2)}
.sw-c.acc{border-color:var(--gr);background:var(--gr2)}
.sw-arr{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px}

/* ── ANNOUNCE ────────────────────────────── */
.ann{border-radius:var(--rl);padding:16px;margin-bottom:12px;border:1px solid var(--bd);background:var(--sur);box-shadow:var(--sh);transition:box-shadow .12s}
.ann:hover{box-shadow:var(--sh-md)}
.ann.pin{border-left:3px solid var(--am)}
.ann-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.ann-ti{font-size:14px;font-weight:600;color:var(--tx)}
.ann-me{font-size:11px;color:var(--tx3);margin-top:2px}
.ann-bd{font-size:13px;color:var(--tx2);line-height:1.7}

/* ── HERO BANNER ─────────────────────────── */
.nsh{background:linear-gradient(135deg,#1E3A8A,#2563EB 60%,#3B82F6);border-radius:var(--rxl);padding:22px 24px;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 24px rgba(37,99,235,.28)}
.nsh-t{font-family:var(--fns);font-size:18px}
.nsh-s{font-size:12px;opacity:.7;margin-top:4px}
.nsh-cnt{margin-left:auto;text-align:center;flex-shrink:0}
.nsh-d{font-size:38px;font-weight:700;line-height:1}
.nsh-dl{font-size:10px;opacity:.55;margin-top:3px}

/* ── FAIRNESS BAR ────────────────────────── */
.fb-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fb-name{width:92px;font-size:12px;color:var(--tx2);text-align:right;flex-shrink:0}
.fb-out{flex:1;height:20px;background:var(--sur2);border-radius:4px;overflow:hidden}
.fb-in{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;min-width:26px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.fb-in span{font-size:10px;color:#fff;font-weight:700}

/* ── ACTIVITY ────────────────────────────── */
.act-it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.act-it:last-child{border-bottom:none}
.act-d{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0}

/* ── WELCOME ─────────────────────────────── */
.wb{background:linear-gradient(135deg,var(--ac2),var(--sur));border:1.5px dashed var(--ac3);border-radius:var(--rxl);padding:32px;text-align:center;margin-bottom:20px}
.wb-ic{font-size:44px;margin-bottom:14px}
.wb-t{font-family:var(--fns);font-size:22px;color:var(--tx);margin-bottom:8px}
.wb-s{font-size:13px;color:var(--tx2);max-width:380px;margin:0 auto 20px;line-height:1.7}

/* ── UTILS ───────────────────────────────── */
.sep-l{font-size:11px;color:var(--tx3);font-weight:500;padding:8px 0 4px}
.hidden{display:none!important}
.dvd{height:1px;background:var(--bd);margin:16px 0}
.pg-sec{font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px}
.pg-sec:first-child{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--sur2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--tx2);border:1px solid var(--bd)}
.chip .x{cursor:pointer;color:var(--tx3);font-size:11px}
.chip .x:hover{color:var(--rd)}

/* ── MOBILE ──────────────────────────────── */
@media(max-width:768px){
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);
    box-shadow:var(--sh-lg);padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sidebar.open{transform:translateX(0)}
  .g2,.g3,.g62{grid-template-columns:1fr!important}
  .stat-g{grid-template-columns:1fr 1fr}
  .input-r2{grid-template-columns:1fr}
  .menu-btn{display:flex!important}
  .cnt{padding:16px; padding-bottom: calc(24px + env(safe-area-inset-bottom));}
  .topbar{padding:0 16px}
  .mbox{padding:20px; width:95%; max-height:85vh;}
  .lb{padding:20px 20px 24px}
  .lh{padding:24px 20px 20px}
  .input { font-size: 16px; } /* Verhindert Auto-Zoom auf iOS */
  .sb-it { padding: 12px 16px; } /* Bessere Touch-Erfahrung */
  .btn { min-height: 44px; } /* Bessere Touch-Erfahrung */
  .av-xl { width: 50px; height: 50px; font-size: 18px; }
}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;backdrop-filter:blur(1px)}
.sb-ov.on{display:block}
</style>
</head>
<body>

<!-- ─── SPLASH SCREEN ───────────────────── -->
<div id="splash">
  <div class="sp-cross">✝</div>
  <div class="sp-title">Ministranten</div>
  <div class="sp-sub" id="sp-parish">Wird geladen…</div>
  <div class="sp-bar"><div class="sp-prog" id="sp-prog"></div></div>
</div>

<!-- Setup & Registrierung entfernt, da nicht gewünscht -->

<!-- OVERLAY MOBILE -->
<div class="sb-ov" id="sb-ov" onclick="closeSb()"></div>

<!-- ─── LOGIN ─────────────────────────────── -->
<div class="ls" id="ls">
  <div class="lc">
    <div class="lh">
      <div class="lh-icon">✝</div>
      <div class="lh-title">Ministranten</div>
      <div class="lh-sub" id="lh-sub">St. Raphael · Münster</div>
    </div>

    <!-- LOGIN FORM -->
    <form class="lb" id="l-main" method="POST" onsubmit="event.preventDefault(); doLogin();">
      <label class="l-lbl" for="l-em">Benutzername</label>
      <div class="fg"><input class="input" type="text" id="l-em" name="username" placeholder="Dein Name" autocomplete="username" maxlength="120" required></div>
      <label class="l-lbl" for="l-pw">Passwort</label>
      <div class="fg pw-wrap">
        <input class="input" type="password" id="l-pw" name="password" placeholder="Passwort" autocomplete="current-password" maxlength="128" required>
        <button type="button" class="pw-tgl" id="pw-tgl-login" onclick="tglPw('l-pw', this)">👁️</button>
      </div>
      <div class="notice ni" style="font-size:11px; margin-bottom:12px">Hinweis: Bei der ersten Anmeldung wirst du aufgefordert, dein Passwort zu ändern.</div>
      <button type="submit" class="btn btn-p" style="width:100%;justify-content:center;margin-bottom:8px" id="login-btn">Anmelden</button>
      <div id="l-err" class="l-err"></div>
    </form>
  </div>
</div>

<!-- ─── APP SHELL ──────────────────────────── -->
<div class="app hidden" id="app">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sb">
    <div class="sb-logo">
      <div class="sb-logo-ic">✝</div>
      <div>
        <div class="sb-logo-nm" id="sb-parish">St. Raphael</div>
        <div class="sb-logo-sm">Ministrantenverwaltung</div>
      </div>
    </div>
    <div id="sb-nav"></div>
    <div class="sb-btm">
      <div class="sb-util">
        <button class="sb-util-btn" onclick="toggleDark()" id="dk-btn" title="Dunkelmodus">🌙</button>
        <button class="sb-util-btn" onclick="showHelp()" title="Hilfe">❓</button>
        <button class="sb-util-btn" onclick="doLogout()" title="Abmelden">⏻</button>
      </div>
      <div class="sb-user" onclick="openProfile()">
        <div class="av av-sm c-m" id="sb-av">TM</div>
        <div style="flex:1;min-width:0">
          <div class="sb-un" id="sb-nm">Thomas M.</div>
          <div class="sb-ur" id="sb-rl">Ministrant</div>
        </div>
        <span style="color:rgba(255,255,255,.25);font-size:11px">⚙</span>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="ic-btn menu-btn" id="menu-btn" onclick="toggleSb()">☰</button>
        <div>
          <div class="pt" id="pt">Kalender</div>
          <div class="pc" id="pc">St. Raphael</div>
        </div>
      </div>
      <div class="tb-r">
        <div id="tb-ex"></div>
        <div class="tb-sep"></div>
        <button class="ic-btn" id="nb-btn" onclick="toggleNotif()" title="Benachrichtigungen">🔔<span class="ndot" id="ndot"></span></button>
        <div class="tb-av c-m" id="tb-av" onclick="openProfile()">TM</div>
      </div>
    </div>
    <div class="cnt" id="cnt"></div>
  </div>
</div>

<!-- NOTIF DROPDOWN -->
<div class="nd hidden" id="nd"></div>
<!-- TOAST -->
<div class="ta-c" id="tc"></div>
<!-- MODAL -->
<div id="ma"></div>

<script src="app.js" defer></script>
</body>
</html>
